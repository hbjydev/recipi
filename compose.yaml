services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recipi
      POSTGRES_USER: recipi
      POSTGRES_PASSWORD: recipi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipi -d recipi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kanidm:
    image: kanidm/server:1.10.4
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      KANIDM_DOMAIN: kanidm.localhost
      KANIDM_ORIGIN: https://kanidm.localhost:8443
      KANIDM_BINDADDRESS: 0.0.0.0:8443
      KANIDM_DB_PATH: /data/kanidm.db
      KANIDM_TLS_CHAIN: /data/chain.pem
      KANIDM_TLS_KEY: /data/key.pem
    volumes:
      - kanidm_data:/data
    networks:
      default:
        aliases:
          - kanidm.localhost
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: recipi-local
      MINIO_ROOT_PASSWORD: recipi-local-password
      MC_HOST_local: http://recipi-local:recipi-local-password@localhost:9000
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  tools:
    image: kanidm/tools:1.10.4
    profiles: [tools]
    entrypoint: ["/sbin/kanidm"]
    environment:
      KANIDM_URL: https://kanidm.localhost:8443
      KANIDM_CA_PATH: /certs/chain.pem
    volumes:
      - ./.local/kanidm:/certs:ro
      - ./.local/kanidm-cli:/root/.cache
    depends_on:
      - kanidm

volumes:
  postgres_data:
  kanidm_data:
  minio_data:
